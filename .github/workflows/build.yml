name: build

# Builds the installers in the cloud so nobody needs a local toolchain.
#   - manual run (Actions tab → build → Run workflow): artifacts only
#   - pushing a tag vX.Y.Z: artifacts are attached to the matching GitHub Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          FFMPEG_PATH: node_modules/ffmpeg-static/ffmpeg.exe
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # latest.yml + blockmap feed the in-app auto-updater (electron-updater)
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  macos:
    runs-on: macos-latest # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          FFMPEG_PATH: node_modules/ffmpeg-static/ffmpeg
      # Apple Silicon build with the arm64 ffmpeg that npm ci downloaded.
      - run: npx electron-builder --mac dmg --arm64 --publish never
      # Intel build: swap in the x64 ffmpeg binary first.
      - name: fetch x64 ffmpeg
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg
      - run: npx electron-builder --mac dmg --x64 --publish never
      - name: check bundled ffmpeg architectures
        run: |
          for app in dist/mac*/argocast.app; do
            echo "$app"; file "$app/Contents/Resources/ffmpeg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4 # the Dart e2e test talks to mock/panel.js
        with:
          node-version: 22
      - run: npm ci --omit=dev
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: rename apk
        run: |
          VERSION=$(node -p "require('../package.json').version")
          mv build/app/outputs/flutter-apk/app-release.apk "build/argocast-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/build/argocast-*-android.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # Swift e2e test talks to mock/panel.js
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: swift test (protocol + e2e against mock panel)
        working-directory: mobile/ios/ArgocastBroadcast
        run: swift test
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: add broadcast extension target (idempotent)
        working-directory: mobile/ios
        run: |
          gem install xcodeproj --no-document
          ruby scripts/add_broadcast_extension.rb
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcodeproj
          path: mobile/ios/Runner.xcodeproj/project.pbxproj
      - name: build (unsigned)
        working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: package unsigned ipa
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('../package.json').version")
          APP=build/ios/iphoneos/Runner.app
          ls "$APP/PlugIns"
          test -d "$APP/PlugIns/ArgocastBroadcast.appex"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry "../argocast-${VERSION}-ios-unsigned.ipa" Payload)
          ls -la build/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/build/argocast-*-ios-unsigned.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # for docs/release-notes/<tag>.md
      - uses: actions/download-artifact@v4
        with:
          pattern: '{windows,macos,android,ios}'
          path: out
          merge-multiple: true
      - name: attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "argocast $GITHUB_REF_NAME (pre-release)" --prerelease "${NOTES_ARG[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
