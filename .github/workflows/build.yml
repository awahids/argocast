name: build

# Builds the installers in the cloud so nobody needs a local toolchain.
#   - manual run (Actions tab → build → Run workflow): artifacts only
#   - pushing a tag vX.Y.Z: artifacts are attached to the matching GitHub Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          FFMPEG_PATH: node_modules/ffmpeg-static/ffmpeg.exe
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          FFMPEG_PATH: node_modules/ffmpeg-static/ffmpeg
      # Apple Silicon build with the arm64 ffmpeg that npm ci downloaded.
      - run: npx electron-builder --mac dmg --arm64 --publish never
      # Intel build: swap in the x64 ffmpeg binary first.
      - name: fetch x64 ffmpeg
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg
      - run: npx electron-builder --mac dmg --x64 --publish never
      - name: check bundled ffmpeg architectures
        run: |
          for app in dist/mac*/argocast.app; do
            echo "$app"; file "$app/Contents/Resources/ffmpeg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "argocast $GITHUB_REF_NAME" --prerelease --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
